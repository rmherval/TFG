amcl:
  ros__parameters:
    use_sim_time: false
    topic_name: scan
    min_particles: 500
    max_particles: 2000
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1
    laser_model_type: likelihood_field
    laser_z_hit: 0.95
    laser_z_rand: 0.05
    laser_sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0
    update_min_d: 0.2
    update_min_a: 0.2
    resample_interval: 1
    transform_tolerance: 0.1
    use_map_topic: false
    pose_topic: initialpose
