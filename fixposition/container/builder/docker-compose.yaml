---
name: fixposition
services:
  fixposition:
    image: fixposition/ros2
    privileged: true
    network_mode: "host"
    ipc: host
    build:
      context: ../..
      dockerfile: container/builder/Dockerfile
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=10
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash \
               && source /home/ubuntu/ros_ws/install/setup.bash \
               && ros2 launch fixposition_driver_ros2 dev.launch"]