---
name: rslidar
services:
  rslidar:
    image: rslidar/ros2
    build:
      context: ../..
      dockerfile: container/builder/Dockerfile
    privileged: true
    network_mode: "host"
    ipc: host
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=10
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash \
               && source /home/ubuntu/ros_ws/install/setup.bash \
               && ros2 launch rslidar_sdk start.py"]