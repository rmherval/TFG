---
name: luxonis
services:
  luxonis:
    image: luxonis/ros2
    build:
      context: ../..
      dockerfile: container/builder/Dockerfile
    privileged: true
    network_mode: "host"
    ipc: host
    device_cgroup_rules:
      - "c 189:* rmw"
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      - /run/udev:/run/udev:ro
      - /sys:/sys:ro
      - ./config:/config:ro
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=10
    command: >
      bash -lc "source /opt/ros/humble/setup.bash &&
                if ros2 pkg list | grep -q '^depthai_ros_driver_v3$'; then
                  ros2 launch depthai_ros_driver_v3 driver_as_part_of_a_robot.launch.py name:=oak camera_model:=OAK-D-S2 params_file:=/config/oak-d-s2-rgbd.yaml publish_tf_from_calibration:=false &
                else
                  ros2 launch depthai_ros_driver driver_as_part_of_a_robot.launch.py name:=oak camera_model:=OAK-D-S2 params_file:=/config/oak-d-s2-rgbd.yaml publish_tf_from_calibration:=false &
                fi &&
                wait"
               
