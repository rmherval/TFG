---
name: fwmini_ros2
services:
  fwmini:
   image: fwmini_ros2/ros2
   privileged: true
   network_mode: "host"
   ipc: host
   build:
      context: ../..
      dockerfile: container/builder/Dockerfile
   environment:
     - CAN_INTERFACE=can0
     - DISPLAY=$DISPLAY
     - QT_X11_NO_MITSHM=1
     - ROS_DOMAIN_ID=10
   volumes:
     - /tmp/.X11-unix:/tmp/.X11-unix:rw
   command: ["bash", "-c", "source /opt/ros/humble/setup.bash \
               && source /home/ubuntu/ros_ws/install/setup.bash \
               && ros2 launch yhs_can_control yhs_can_control.launch.py"]


