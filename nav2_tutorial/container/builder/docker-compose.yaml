---
name: nav2_tutorial
services:
  nav2_tutorial:
    image: nav2_tutorial/ros2
    build:
      context: ../..
      dockerfile: container/builder/Dockerfile
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=10
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /home/ai2lab/Documents/nav2_tutorial/data:/home/ubuntu/ros_ws/src
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash \
               && source /home/ubuntu/ros_ws/install/setup.bash \
               && ros2 launch nav2_tutorial mqtt_waypoint_follower.launch.py"]

  rviz_tutorial:
    image: nav2_tutorial/ros2
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=10
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /home/ai2lab/Documents/nav2_tutorial/data:/home/ubuntu/ros_ws/src
    depends_on:
      - nav2_tutorial
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash \
               && source /home/ubuntu/ros_ws/install/setup.bash \
               && rviz2 -d /home/ubuntu/ros_ws/src/rviz_config.rviz "]

  scan:
    image: nav2_tutorial/ros2
    network_mode: "host"
    ipc: host
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=10
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: >
      bash -c "source /opt/ros/humble/setup.bash &&
               source /home/ubuntu/ros_ws/install/setup.bash &&
               ros2 launch nav2_tutorial pointcloud_to_laserscan.launch.py"

  foxglove:
    image: nav2_tutorial/ros2
    privileged: true
    network_mode: "host"
    ipc: host
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=10
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command:
      [
        "bash",
        "-c",
        "source /opt/ros/humble/setup.bash \
        && source /home/ubuntu/ros_ws/install/setup.bash \
        && ros2 launch foxglove_bridge foxglove_bridge_launch.xml \
          topic_whitelist:=\"['^/goals$', '^/fixposition/odometry_llh$']\""
      ]